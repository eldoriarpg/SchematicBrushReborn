[versions]
jackson = "2.16.2"
utilities = "2.1.11"
minecraft-latest = "1.20.1-R0.1-SNAPSHOT"
fawe = "2.14.3"
junit = "6.0.1"

[libraries]
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations", version.ref = "jackson" }
jackson-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }

eldoutil-plugin = { module = "de.eldoria.util:plugin", version.ref = "utilities" }
eldoutil-jackson = { module = "de.eldoria.util:jackson-configuration", version.ref = "utilities" }
eldoutil-serialization = { module = "de.eldoria.util:legacy-serialization", version.ref = "utilities" }
eldoutil-metrics = { module = "de.eldoria.util:metrics", version.ref = "utilities" }
eldoutil-updater = { module = "de.eldoria.util:updater", version.ref = "utilities" }
eldoutil-crossversion = { module = "de.eldoria.util:crossversion", version.ref = "utilities" }

bstats = "org.bstats:bstats-bukkit:3.1.0"
messageblocker = "de.eldoria:messageblocker:1.1.3"
jetbrains-annotations = "org.jetbrains:annotations:26.0.2-1"
log4j-slf4j2 = "org.apache.logging.log4j:log4j-slf4j2-impl:2.25.2"
log4j-core = "org.apache.logging.log4j:log4j-core:2.25.2"

paper-latest = { module = "io.papermc.paper:paper-api", version.ref = "minecraft-latest" }
paper-v17 = "io.papermc.paper:paper-api:1.17.1-R0.1-SNAPSHOT"

worldedit = "com.sk89q.worldedit:worldedit-bukkit:7.3.18"
fawe-core = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Core", version.ref = "fawe" }
fawe-bukkit = { module = "com.fastasyncworldedit:FastAsyncWorldEdit-Bukkit", version.ref = "fawe" }

junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }
mockbukkit = "com.github.seeseemelk:MockBukkit-v1.19:3.1.0"
mockito = "org.mockito:mockito-core:5.20.0"

gradle-spotless = "com.diffplug.spotless:spotless-plugin-gradle:8.1.0"
gradle-publishdata = "de.chojo:publishdata:2.0.0"

[bundles]
jackson = ["jackson-core", "jackson-databind", "jackson-annotations", "jackson-yaml"]
utilities = ["eldoutil-jackson", "eldoutil-plugin", "eldoutil-serialization", "eldoutil-metrics", "eldoutil-updater", "eldoutil-crossversion"]

[plugins]
shadow = { id = "com.gradleup.shadow", version = "9.3.0" }
pluginyml-bukkit = { id = "de.eldoria.plugin-yml.bukkit", version = "0.8.0" }
runserver = { id = "xyz.jpenilla.run-paper", version = "3.0.2" }
